<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816" />
      <stop offset="40%" stop-color="#0c0e27" />
      <stop offset="75%" stop-color="#180b2a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Accent Gradient for Text & Borders -->
    <linearGradient id="neon-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="35%" stop-color="#a855f7" />
      <stop offset="70%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="340" rx="20" fill="url(#bg-grad)" />
  
  <!-- Subtle Grid Overlay -->
  <rect width="1200" height="340" rx="20" fill="url(#grid)" />

  <!-- Ambient Glow Orbs in Background -->
  <circle cx="150" cy="80" r="160" fill="#ec4899" fill-opacity="0.12" filter="url(#glow)" />
  <circle cx="1050" cy="240" r="180" fill="#00f0ff" fill-opacity="0.12" filter="url(#glow)" />
  <circle cx="600" cy="170" r="130" fill="#a855f7" fill-opacity="0.09" filter="url(#glow)" />

  <!-- Outer Neon Border Frame -->
  <rect x="2" y="2" width="1196" height="336" rx="18" fill="none" stroke="url(#neon-grad)" stroke-width="2" stroke-opacity="0.6" />

  <!-- Top Status Pill -->
  <g transform="translate(470, 38)">
    <rect width="260" height="32" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="20" cy="16" r="5" fill="#10b981" filter="url(#subtle-glow)">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="36" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1">
      AVAILABLE FOR COLLABS
    </text>
  </g>

  <!-- Main Name Title -->
  <text x="600" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="800" fill="url(#neon-grad)" letter-spacing="0.5" filter="url(#subtle-glow)">
    Ashutosh Pankaj Rai
  </text>

  <!-- Secondary Title / Role -->
  <text x="600" y="195" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#f8fafc" letter-spacing="1.5">
    3D DEVELOPER PORTFOLIO &amp; AI SYSTEMS
  </text>

  <!-- Key Badges Strip in Banner -->
  <g transform="translate(600, 245)" text-anchor="middle">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" font-weight="500" fill="#94a3b8" letter-spacing="0.5">
      🚀 <tspan fill="#ec4899" font-weight="600">Founder @ PostAura</tspan>  •  ⚡ <tspan fill="#a855f7" font-weight="600">AI &amp; Automation</tspan>  •  🏆 <tspan fill="#00f0ff" font-weight="600">Best Innovation Winner</tspan>  •  🎓 <tspan fill="#38bdf8" font-weight="600">Educator</tspan>
    </text>
  </g>

  <!-- Bottom Wave Divider Inside SVG -->
  <path d="M 0 310 Q 300 280, 600 315 T 1200 310 L 1200 340 L 0 340 Z" fill="url(#neon-grad)" fill-opacity="0.2" />
  <path d="M 0 325 Q 300 300, 600 328 T 1200 325 L 1200 340 L 0 340 Z" fill="url(#neon-grad)" fill-opacity="0.4" />
</svg>
